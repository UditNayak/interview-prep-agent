services:
  n8n:
    image: n8nio/n8n:latest
    container_name: interview-prep-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- Core ---
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_RUNNERS_ENABLED=true

      # Encryption key for stored credentials (change this to any long random string)
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # IMPORTANT: lets the workflow read API keys via {{ $env.XXX }} expressions.
      # If this is "true", the HTTP nodes can't see your keys.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # --- API keys consumed by the workflow's HTTP Request nodes ---
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}

      # The "From" address shown on the emailed report. Must match the
      # account in your SMTP credential (e.g. your Gmail address).
      - FROM_EMAIL=${FROM_EMAIL}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
